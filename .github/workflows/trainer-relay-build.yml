name: trainer-relay-build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.5.0
      - name: Set up Node.js with pnpm cache
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
      - name: Lint frontend
        run: pnpm run lint
      - name: Typecheck frontend
        run: pnpm run typecheck
      - name: Test frontend
        run: pnpm run test -- --pool=forks --maxWorkers=1 --no-file-parallelism
      - name: Build frontend
        run: pnpm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          check-latest: true
      - name: Run backend tests
        run: python -m unittest discover -s tests_backend -p "test_*.py"
      - name: Compile backend sources
        run: python -m compileall -q main.py trainer_relay tests_backend tests_packaging

  build-plugin:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up PNPM
        uses: pnpm/action-setup@v5
        with:
          version: 11.5.0
      - name: Set up Node.js with pnpm cache
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Build plugin
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run package TrainerRelay.zip
      - name: Verify package layout
        run: python -m unittest discover -s tests_packaging -p "test_*.py"
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: TrainerRelay
          path: TrainerRelay.zip

  publish-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: build-plugin
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: TrainerRelay
          path: release
      - name: Publish to Github release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'experimental') || contains(github.ref_name, 'pre') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: release/TrainerRelay.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
