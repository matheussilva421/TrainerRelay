name: trainer-relay-build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  lint-frontend:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.5.0
      - name: Set up Node.js with pnpm cache
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Validate frontend source
        run: |
          pnpm install --frozen-lockfile
          pnpm run check

  lint-backend:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          check-latest: true
      - name: Install flake8
        run: pip install flake8
      - name: Lint backend source
        run: flake8 --max-line-length=120 main.py

  build-plugin:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up PNPM
        uses: pnpm/action-setup@v5
        with:
          version: 11.5.0
      - name: Set up Node.js with pnpm cache
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Build plugin
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          mkdir -p output/TrainerRelay/dist
          cp dist/index.js  output/TrainerRelay/dist
          cp main.py        output/TrainerRelay
          cp plugin.json    output/TrainerRelay
          cp package.json   output/TrainerRelay
          cp README.md      output/TrainerRelay
          cp LICENSE        output/TrainerRelay
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: TrainerRelay
          path: output/*

  publish-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: build-plugin
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: TrainerRelay
          path: release
      - name: Package plugin
        run: |
          cd release
          zip -r TrainerRelay.zip TrainerRelay
      - name: Publish to Github release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'pre') }}
          files: release/TrainerRelay.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
